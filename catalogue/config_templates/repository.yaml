# Defaults for a repository created through the app.
#
# Every key here is written into repositories/config.yaml for a new repository. `name`,
# `description`, `team_permissions` and `user_permissions` are filled in from the request.
# Keys and allowed values come from terraform-repository-schema.yaml.
name: null
description: null
visibility: private
archived: false
is_template: false
has_issues: true
has_projects: true
has_wiki: true
has_discussions: false
has_downloads: true
has_pages: false
homepage_url: null
allow_merge_commit: true
allow_squash_merge: true
allow_rebase_merge: true
allow_auto_merge: false
allow_update_branch: false
delete_branch_on_merge: false
merge_commit_title: MERGE_MESSAGE
merge_commit_message: PR_TITLE
squash_merge_commit_title: COMMIT_OR_PR_TITLE
squash_merge_commit_message: COMMIT_MESSAGES
team_permissions: {}
user_permissions: {}
