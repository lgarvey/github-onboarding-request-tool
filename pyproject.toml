[project]
name = "github-onboarding-request-tool"
version = "0.1.0"
description = "POC for requesting GitHub repo/team access changes backed by terraform-github"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = ["django (>=5.2,<5.3)", "django-environ (>=0.14.0,<0.15.0)", "dj-database-url (>=3.1.2,<4.0.0)", "whitenoise (>=6.12.0,<7.0.0)", "django-waffle (>=5.0.0,<6.0.0)", "psycopg[binary] (>=3.3.6,<4.0.0)", "django-staff-sso-client (>=5.3.4,<6.0.0)", "pyyaml (>=6.0.3,<7.0.0)"]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-django = "^4.14.0"
factory-boy = "^3.3.3"
pytest-cov = "^7.1.0"
ruff = "^0.16.10"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.coverage.run]
omit = ["tests/*", "*/migrations/*", "manage.py", "config/asgi.py", "config/wsgi.py"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["terraform-github", "static", "staticfiles", "**/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
