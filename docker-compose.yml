services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: github_access
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d github_access"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    environment:
      # TERRAFORM_GITHUB_PATH in .env is the path on the host. Inside the container the
      # config is always mounted at /terraform-github.
      TERRAFORM_GITHUB_PATH: /terraform-github
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ${TERRAFORM_GITHUB_PATH:-./terraform-github-sample}:/terraform-github:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
