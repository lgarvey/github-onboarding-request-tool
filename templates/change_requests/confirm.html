{% extends "base.html" %}

{% block title %}Confirm request{% endblock %}

{% block content %}
  <h1 class="h3 mb-3">Check your request</h1>
  <p>Nothing has been sent yet. Check the changes below, then submit the request.</p>

  <pre class="bg-body-tertiary border rounded p-3">{% for line in summary_lines %}{{ line }}
{% endfor %}</pre>

  <form method="post" class="d-flex gap-2">
    {% csrf_token %}
    <button type="submit" class="btn btn-primary">Submit request</button>
    <a class="btn btn-outline-secondary" href="{{ change_request.get_edit_url }}">Back to edit</a>
  </form>
{% endblock %}
